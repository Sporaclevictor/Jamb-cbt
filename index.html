<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAMB CBT – Practice Past Questions</title>
<meta name="description" content="JAMB CBT practice with past questions and answers. Powered by Step By Step Digital.">
<meta name="theme-color" content="#14213D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F9; --card:#fff; --ink:#14213D; --muted:#5B6578; --line:#DDE2EC;
  --green:#0B7A4B; --green-d:#085C39; --amber:#F2A900; --red:#C62828; --blue:#1D4ED8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Source Sans 3',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;font-size:16px;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,.brand{font-family:'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.01em}
a{color:var(--green)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
header.top{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:20}
.brand{font-size:1.35rem;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--amber);color:var(--ink);padding:1px 8px;border-radius:6px}
.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:18px 14px 40px}
footer{text-align:center;padding:18px 12px;font-size:.9rem;color:var(--muted);border-top:1px solid var(--line)}
footer b{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h2{font-size:1.5rem;margin-bottom:6px}
h3{font-size:1.15rem;margin-bottom:8px}
p.sub{color:var(--muted);margin-bottom:12px}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--green);color:#fff;transition:background .15s}
.btn:hover{background:var(--green-d)}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.alt:hover{background:var(--paper)}
.btn.warn{background:var(--red)}
.btn.amber{background:var(--amber);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:.88rem;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.top .btn.alt{background:transparent;color:#fff;border-color:#ffffff55}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);margin-bottom:12px}
textarea{min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:.88rem}
label{display:block;font-weight:600;margin-bottom:4px;font-size:.95rem}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 200px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.82rem;font-weight:700}
.b-green{background:#D9F2E5;color:var(--green-d)}
.b-amber{background:#FFF1CC;color:#7A5600}
.b-red{background:#FADADA;color:var(--red)}
.b-gray{background:#E8EBF2;color:var(--muted)}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:14px}
.subj{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff;font-weight:600}
.subj input{width:auto;margin:0;accent-color:var(--green)}
.subj.on{border-color:var(--green);background:#EEF9F3}
.hero{background:var(--ink);color:#fff;border-radius:16px;padding:28px 20px;margin-bottom:16px}
.hero h1{font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.1;margin-bottom:10px}
.hero p{color:#C9D1E3;max-width:46ch}
.auth{max-width:420px;margin:0 auto}
.err{color:var(--red);font-weight:600;margin-bottom:10px}
.ok{color:var(--green-d);font-weight:600;margin-bottom:10px}
/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px;position:sticky;top:58px;z-index:10}
.timer{font-family:'Bricolage Grotesque';font-weight:800;font-size:1.3rem;color:var(--amber)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.tab{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:700;cursor:pointer;font:inherit;font-weight:700;color:var(--ink)}
.tab.on{background:var(--green);color:#fff;border-color:var(--green)}
.qtext{font-size:1.15rem;font-weight:600;margin:6px 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;color:var(--ink)}
.opt:hover{background:var(--paper)}
.opt .k{flex:0 0 28px;height:28px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.opt.sel{border-color:var(--green);background:#EEF9F3}
.opt.sel .k{background:var(--green);color:#fff}
.opt.right{border-color:var(--green);background:#E3F6EC}
.opt.wrong{border-color:var(--red);background:#FCEAEA}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pn{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 0;font-weight:700;cursor:pointer;font:inherit;font-weight:700;color:var(--ink)}
.pn.done{background:var(--green);color:#fff;border-color:var(--green)}
.pn.cur{outline:3px solid var(--amber)}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.score{font-family:'Bricolage Grotesque';font-weight:800;font-size:3.4rem;line-height:1}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tablewrap{overflow-x:auto}
.bank{background:var(--paper);border:1.5px dashed var(--green);border-radius:12px;padding:14px;margin:12px 0}
.bank .no{font-family:'Bricolage Grotesque';font-weight:800;font-size:1.9rem;letter-spacing:.04em}
.price{font-family:'Bricolage Grotesque';font-weight:800;font-size:2.2rem;color:var(--green-d)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:99;max-width:90vw}
.expl{background:#FFF8E1;border-left:4px solid var(--amber);padding:8px 12px;border-radius:6px;margin-top:6px}
.spin{text-align:center;padding:40px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand" data-act="home"><i>JAMB</i> CBT</div>
  <div class="nav" id="nav"></div>
</header>
<main id="app"><div class="spin">Loading…</div></main>
<footer>© <span id="yr"></span> JAMB CBT · Powered by <b>Step By Step Digital</b></footer>

<script type="module">
/* =====================================================================
   1) CONFIGURE THESE TWO THINGS  (see README.md)
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCBOd_qQOkgCEj9OZ-c1Q_dKbsZ9a_OgUU",
  authDomain: "jamb-cbt-bf489.firebaseapp.com",
  projectId: "jamb-cbt-bf489",
  storageBucket: "jamb-cbt-bf489.firebasestorage.app",
  messagingSenderId: "762911119733",
  appId: "1:762911119733:web:399792872f422d46ca9b3c"
};
// Your admin login email (lowercase). Must match the email in firestore.rules
const ADMIN_EMAIL = "sporaclevictor@gmail.com";
/* ===================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, deleteDoc, collection, getDocs, query, where, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const SUBJECTS = ["English Language","Mathematics","Physics","Chemistry","Biology","Economics","Government","Literature in English","Commerce","Accounting","Agricultural Science","Geography","Christian Religious Studies","Islamic Religious Studies"];
const YEARS = ["All years","2025","2024","2023","2022","2021"];
const FREE_PER_SUBJECT = 5;
const QUESTIONS_PER_SUBJECT = 40;
const MINUTES_PER_SUBJECT = 30;
const DEFAULT_SETTINGS = { price: 2000, bankName: "Kuda Bank", accountNumber: "2013463188", accountName: "Step By Step Digital", contact: "" };

const S = { user:null, profile:null, settings:{...DEFAULT_SETTINGS}, view:"loading", authMode:"login", authMsg:"", picked:["English Language"], year:"All years", adminTab:"settings" };
let E = null;      // current exam
let timerId = null;

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const naira = n => "₦" + Number(n||0).toLocaleString("en-NG");
const isAdmin = () => S.user && S.user.email && S.user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
const isPremium = () => isAdmin() || (S.profile && S.profile.paid === true);
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function friendly(e){
  const c = e.code||"";
  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")) return "Wrong email or password.";
  if(c.includes("email-already-in-use")) return "This email already has an account. Log in instead.";
  if(c.includes("weak-password")) return "Password must be at least 6 characters.";
  if(c.includes("invalid-email")) return "Enter a valid email address.";
  if(c.includes("permission-denied")) return "Permission denied. Check your Firestore rules.";
  return e.message || "Something went wrong.";
}

/* ---------------- settings ---------------- */
async function loadSettings(){
  try{ const s = await getDoc(doc(db,"settings","app")); if(s.exists()) S.settings = {...DEFAULT_SETTINGS, ...s.data()}; }catch(e){ console.warn(e); }
}

/* ---------------- auth flow ---------------- */
onAuthStateChanged(auth, async user => {
  await loadSettings();
  if(!user){ S.user=null; S.profile=null; S.view="auth"; return render(); }
  try{
    let snap = await getDoc(doc(db,"users",user.uid));
    if(!snap.exists()){
      await setDoc(doc(db,"users",user.uid),{ name:S.pendingName||user.email.split("@")[0], email:user.email.toLowerCase(), paid:false, banned:false, createdAt:serverTimestamp() });
      snap = await getDoc(doc(db,"users",user.uid));
    }
    const p = snap.data();
    if(p.banned && !(user.email.toLowerCase()===ADMIN_EMAIL.toLowerCase())){
      S.authMsg = "This account has been banned. Contact support."; await signOut(auth); return;
    }
    S.user=user; S.profile=p;
    if(!["pay","exam","result","admin"].includes(S.view)) S.view="dash";
    render();
  }catch(e){ S.authMsg = friendly(e); await signOut(auth); }
});

/* ---------------- rendering ---------------- */
function renderNav(){
  const n = $("#nav");
  if(!S.user){ n.innerHTML=""; return; }
  n.innerHTML = `
    ${isAdmin()?`<button class="btn alt sm" data-act="admin">Admin</button>`:""}
    ${!isPremium()?`<button class="btn amber sm" data-act="pay">Upgrade</button>`:""}
    <button class="btn alt sm" data-act="logout">Log out</button>`;
}
function render(){
  clearInterval(timerId);
  renderNav();
  const a = $("#app");
  if(S.view==="loading") a.innerHTML = `<div class="spin">Loading…</div>`;
  else if(S.view==="auth") a.innerHTML = authView();
  else if(S.view==="dash") a.innerHTML = dashView();
  else if(S.view==="pay"){ a.innerHTML = payView(); loadMyPayments(); }
  else if(S.view==="exam"){ a.innerHTML = examView(); startTimer(); }
  else if(S.view==="result") a.innerHTML = resultView();
  else if(S.view==="admin"){ a.innerHTML = adminShell(); loadAdminTab(); }
  window.scrollTo(0,0);
}

function authView(){
  const login = S.authMode==="login";
  return `
  <div class="hero"><h1>Practice JAMB CBT like the real exam.</h1><p>Timed tests, past questions and instant corrections. Try 5 free questions in every subject.</p></div>
  <div class="card auth">
    <h2>${login?"Log in":"Create your account"}</h2>
    ${S.authMsg?`<div class="${S.authMsg.startsWith("✓")?"ok":"err"}">${esc(S.authMsg)}</div>`:""}
    ${login?"":`<label for="a-name">Full name</label><input id="a-name" autocomplete="name">`}
    <label for="a-email">Email</label><input id="a-email" type="email" autocomplete="email">
    <label for="a-pass">Password</label><input id="a-pass" type="password" autocomplete="${login?"current-password":"new-password"}">
    <button class="btn block" data-act="auth-submit">${login?"Log in":"Sign up"}</button>
    <p style="margin-top:12px;text-align:center">
      <a href="#" data-act="auth-toggle">${login?"New here? Create an account":"Already registered? Log in"}</a>
      ${login?` · <a href="#" data-act="reset">Forgot password?</a>`:""}
    </p>
  </div>`;
}

function dashView(){
  const name = esc((S.profile?.name||"").split(" ")[0]||"student");
  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
      <div><h2>Hello, ${name}</h2><p class="sub" style="margin:0">Pick your subjects and start a timed test.</p></div>
      ${isPremium()?`<span class="badge b-green">Premium: full access</span>`:`<span class="badge b-amber">Free trial: ${FREE_PER_SUBJECT} questions per subject</span>`}
    </div>
  </div>
  <div class="card">
    <h3>Choose subjects</h3>
    <p class="sub">English is compulsory. Pick up to 3 more (4 subjects like the real JAMB).</p>
    <div class="subjects">
      ${SUBJECTS.map(s=>`<label class="subj ${S.picked.includes(s)?"on":""}">
        <input type="checkbox" data-act="pick" data-s="${esc(s)}" ${S.picked.includes(s)?"checked":""} ${s==="English Language"?"disabled":""}> ${esc(s)}</label>`).join("")}
    </div>
    <label for="yr-sel">Question year</label>
    <select id="yr-sel" data-act="year">${YEARS.map(y=>`<option ${S.year===y?"selected":""}>${y}</option>`).join("")}</select>
    <button class="btn block" data-act="start">Start test (${S.picked.length*MINUTES_PER_SUBJECT} minutes)</button>
    ${!isPremium()?`<p class="sub" style="margin-top:12px">Want every question from the last 5 years? <a href="#" data-act="pay">Unlock full access for ${naira(S.settings.price)}</a>.</p>`:""}
  </div>`;
}

function payView(){
  const st = S.settings;
  return `
  <div class="card">
    <h2>Unlock full access</h2>
    <p class="sub">All past questions, all subjects, unlimited practice.</p>
    <div class="price">${naira(st.price)}</div>
    <div class="bank">
      <div>Transfer to</div>
      <div class="no">${esc(st.accountNumber)}</div>
      <div><b>${esc(st.bankName)}</b>${st.accountName?` · ${esc(st.accountName)}`:""}</div>
    </div>
    <p class="sub">After paying, fill the form below. Your account is activated once the payment is confirmed${st.contact?` (questions? ${esc(st.contact)})`:""}.</p>
    ${isPremium()?`<div class="ok">Your account is already premium.</div>`:`
    <label for="p-name">Name on the account you paid from</label><input id="p-name">
    <div class="row"><div><label for="p-amt">Amount paid (₦)</label><input id="p-amt" type="number" value="${esc(st.price)}"></div>
    <div><label for="p-ref">Reference / last 4 digits of sender account</label><input id="p-ref"></div></div>
    <button class="btn block" data-act="pay-submit">I have paid</button>`}
  </div>
  <div class="card"><h3>Your payment requests</h3><div id="my-pay"><div class="spin">Loading…</div></div></div>
  <button class="btn alt" data-act="home">Back</button>`;
}
async function loadMyPayments(){
  const box = $("#my-pay"); if(!box) return;
  try{
    const snap = await getDocs(query(collection(db,"payments"), where("uid","==",S.user.uid)));
    const rows = snap.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    box.innerHTML = rows.length ? `<div class="tablewrap"><table><tr><th>Amount</th><th>Reference</th><th>Status</th></tr>${rows.map(r=>`<tr><td>${naira(r.amount)}</td><td>${esc(r.reference)}</td><td><span class="badge ${r.status==="approved"?"b-green":r.status==="rejected"?"b-red":"b-amber"}">${esc(r.status)}</span></td></tr>`).join("")}</table></div>` : `<p class="sub">No payments yet.</p>`;
  }catch(e){ box.innerHTML = `<div class="err">${esc(friendly(e))}</div>`; }
}

/* ---------------- exam ---------------- */
async function startExam(){
  if(!S.picked.includes("English Language")) S.picked.unshift("English Language");
  const btn = document.querySelector('[data-act="start"]'); if(btn){ btn.disabled=true; btn.textContent="Preparing your questions…"; }
  try{
    const subjects = [];
    for(const name of S.picked){
      const q = isPremium()
        ? query(collection(db,"questions"), where("subject","==",name))
        : query(collection(db,"questions"), where("subject","==",name), where("free","==",true));
      const snap = await getDocs(q);
      let list = snap.docs.map(d=>({id:d.id,...d.data()}));
      if(isPremium() && S.year!=="All years") list = list.filter(x=>String(x.year)===S.year);
      list = shuffle(list).slice(0, isPremium()?QUESTIONS_PER_SUBJECT:FREE_PER_SUBJECT);
      if(list.length) subjects.push({name, qs:list}); else toast(`No questions available yet for ${name}.`);
    }
    if(!subjects.length){ render(); return toast("No questions found. Admin needs to add questions."); }
    E = { subjects, s:0, i:0, answers:{}, endAt: Date.now()+subjects.length*MINUTES_PER_SUBJECT*60000 };
    S.view="exam"; render();
  }catch(e){ toast(friendly(e)); render(); }
}
function examView(){
  const sub = E.subjects[E.s], q = sub.qs[E.i];
  const key = `${E.s}_${E.i}`;
  return `
  <div class="exam-bar"><div>Question ${E.i+1} of ${sub.qs.length}</div><div class="timer" id="timer">--:--</div><button class="btn amber sm" data-act="submit">Submit</button></div>
  <div class="tabs">${E.subjects.map((s,i)=>`<button class="tab ${i===E.s?"on":""}" data-act="subj-tab" data-i="${i}">${esc(s.name)}</button>`).join("")}</div>
  <div class="card">
    ${q.year?`<span class="badge b-gray">${esc(q.year)}</span>`:""}
    <div class="qtext">${esc(q.question)}</div>
    ${q.options.map((o,k)=>`<button class="opt ${E.answers[key]===k?"sel":""}" data-act="answer" data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}
    <div class="nav2"><button class="btn alt" data-act="prev" ${E.i===0?"disabled":""}>Previous</button><button class="btn" data-act="next" ${E.i===sub.qs.length-1?"disabled":""}>Next</button></div>
  </div>
  <div class="card"><h3>Jump to question</h3><div class="palette">${sub.qs.map((_,i)=>`<button class="pn ${E.answers[`${E.s}_${i}`]!==undefined?"done":""} ${i===E.i?"cur":""}" data-act="jump" data-i="${i}">${i+1}</button>`).join("")}</div></div>`;
}
function startTimer(){
  const tick = ()=>{
    const left = Math.max(0, E.endAt-Date.now());
    const m = String(Math.floor(left/60000)).padStart(2,"0"), s = String(Math.floor(left%60000/1000)).padStart(2,"0");
    const t = $("#timer"); if(t) t.textContent = `${m}:${s}`;
    if(left<=0){ clearInterval(timerId); toast("Time up! Submitting…"); finishExam(); }
  };
  tick(); timerId = setInterval(tick,1000);
}
function finishExam(){
  clearInterval(timerId);
  let total=0;
  const rows = E.subjects.map((s,si)=>{
    let right=0; s.qs.forEach((q,i)=>{ if(E.answers[`${si}_${i}`]===q.answer) right++; });
    const pct = right/s.qs.length; total += pct*100;
    return { name:s.name, right, n:s.qs.length };
  });
  E.result = { rows, jamb:Math.round(total) };
  S.view="result"; render();
}
function resultView(){
  const r = E.result;
  return `
  <div class="card" style="text-align:center">
    <p class="sub">Your estimated JAMB-style score</p>
    <div class="score">${r.jamb}<span style="font-size:1.2rem;color:var(--muted)"> / ${E.subjects.length*100}</span></div>
    <p class="sub" style="margin-top:8px">Each subject counts out of 100, based on the questions you attempted in this test.</p>
  </div>
  <div class="card"><h3>By subject</h3><div class="tablewrap"><table><tr><th>Subject</th><th>Correct</th><th>Score</th></tr>
    ${r.rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.right} / ${x.n}</td><td><b>${Math.round(x.right/x.n*100)}</b></td></tr>`).join("")}</table></div></div>
  <div class="card"><h3>Review answers</h3>
    ${E.subjects.map((s,si)=>`<h3 style="margin-top:10px">${esc(s.name)}</h3>${s.qs.map((q,i)=>{
      const a = E.answers[`${si}_${i}`];
      return `<div style="margin-bottom:18px"><div class="qtext" style="font-size:1rem">${i+1}. ${esc(q.question)}</div>
      ${q.options.map((o,k)=>`<div class="opt ${k===q.answer?"right":k===a?"wrong":""}" style="cursor:default"><span class="k">${"ABCD"[k]}</span><span>${esc(o)}${k===a?" (your answer)":""}</span></div>`).join("")}
      ${a===undefined?`<span class="badge b-gray">Not answered</span>`:""}
      ${q.explanation?`<div class="expl">${esc(q.explanation)}</div>`:""}</div>`;}).join("")}`).join("")}
  </div>
  <button class="btn block" data-act="home">Back to dashboard</button>`;
}

function drawUsers(term){
  term = term.toLowerCase();
  const list = S._users.filter(u=>(u.email+" "+u.name).toLowerCase().includes(term));
  $("#u-list").innerHTML = `<div class="tablewrap"><table><tr><th>User</th><th>Status</th><th></th></tr>${list.map(u=>`<tr>
    <td>${esc(u.name)}<br><small>${esc(u.email)}</small></td>
    <td>${u.banned?`<span class="badge b-red">Banned</span>`:u.paid?`<span class="badge b-green">Premium</span>`:`<span class="badge b-gray">Free</span>`}</td>
    <td>${u.email===ADMIN_EMAIL.toLowerCase()?"":`<button class="btn sm ${u.banned?"":"warn"}" data-act="ban" data-id="${u.id}" data-v="${u.banned?0:1}">${u.banned?"Unban":"Ban"}</button>
    <button class="btn sm alt" data-act="premium" data-id="${u.id}" data-v="${u.paid?0:1}">${u.paid?"Revoke premium":"Make premium"}</button>`}</td></tr>`).join("")}</table></div>`;

async function drawQuestions(){
  const box = $("#q-list"); if(!box) return;
  box.innerHTML = `<div class="spin">Loading…</div>`;
  const sub = $("#q-filter").value;
  const snap = await getDocs(query(collection(db,"questions"), where("subject","==",sub)));
  const rows = snap.docs.map(d=>({id:d.id,...d.data()}));
  box.innerHTML = `<p class="sub">${rows.length} question(s) · ${rows.filter(r=>r.free).length} free</p><div class="tablewrap"><table>${rows.map(r=>`<tr>
    <td style="min-width:220px">${esc(r.question).slice(0,110)}<br><small>${esc(r.year||"")} · answer ${"ABCD"[r.answer]}</small></td>
    <td><span class="badge ${r.free?"b-green":"b-gray"}">${r.free?"Free":"Premium"}</span></td>
    <td><button class="btn sm alt" data-act="q-free" data-id="${r.id}" data-v="${r.free?0:1}">${r.free?"Make premium":"Make free"}</button>
    <button class="btn sm warn" data-act="q-del" data-id="${r.id}">Delete</button></td></tr>`).join("")}</table></div>`;
}
async function freeCounts(){
  const snap = await getDocs(query(collection(db,"questions"), where("free","==",true)));
  const c = {}; snap.docs.forEach(d=>{ const s=d.data().subject; c[s]=(c[s]||0)+1; }); return c;
}
async function importQuestions(arr){
  const counts = await freeCounts();
  let batch = writeBatch(db), n=0, total=0;
  for(const q of arr){
    if(!q.subject||!q.question||!Array.isArray(q.options)||q.options.length!==4||![0,1,2,3].includes(Number(q.answer))) continue;
    const free = (counts[q.subject]||0) < FREE_PER_SUBJECT; if(free) counts[q.subject]=(counts[q.subject]||0)+1;
    batch.set(doc(collection(db,"questions")), { subject:String(q.subject), year:String(q.year||""), question:String(q.question), options:q.options.map(String), answer:Number(q.answer), explanation:String(q.explanation||""), free, createdAt:serverTimestamp() });
    n++; total++;
    if(n===400){ await batch.commit(); batch=writeBatch(db); n=0; }
  }
  if(n) await batch.commit();
  return total;
}

/* ---------------- actions (click handling) ---------------- */
const A = {
  home(){ if(!S.user){return;} S.view="dash"; render(); },
  logout(){ signOut(auth); S.view="auth"; },
  pay(){ S.view="pay"; render(); },
  admin(){ if(isAdmin()){ S.view="admin"; render(); } },
  "auth-toggle"(){ S.authMode = S.authMode==="login"?"signup":"login"; S.authMsg=""; render(); },
  async reset(){
    const email = $("#a-email").value.trim(); if(!email){ S.authMsg="Enter your email first."; return render(); }
    try{ await sendPasswordResetEmail(auth,email); S.authMsg="✓ Reset link sent. Check your inbox."; }catch(e){ S.authMsg=friendly(e); } render();
  },
  async "auth-submit"(el){
    const email = $("#a-email").value.trim().toLowerCase(), pass = $("#a-pass").value;
    if(!email||!pass){ S.authMsg="Enter your email and password."; return render(); }
    el.disabled=true;
    try{
      if(S.authMode==="signup"){
        const name = $("#a-name").value.trim(); if(!name){ S.authMsg="Enter your name."; return render(); }
        S.pendingName = name;   // used by onAuthStateChanged when it creates the profile
        await createUserWithEmailAndPassword(auth,email,pass);
      } else await signInWithEmailAndPassword(auth,email,pass);
      S.authMsg="";
    }catch(e){ S.authMsg=friendly(e); render(); }
  },
  pick(el){
    const s = el.dataset.s;
    if(el.checked){ if(S.picked.length>=4){ el.checked=false; return toast("You can pick a maximum of 4 subjects."); } S.picked.push(s); }
    else S.picked = S.picked.filter(x=>x!==s);
    render();
  },
  year(el){ S.year = el.value; },
  start(){ startExam(); },
  answer(el){ E.answers[`${E.s}_${E.i}`] = Number(el.dataset.k); render(); },
  next(){ E.i++; render(); }, prev(){ E.i--; render(); },
  jump(el){ E.i = Number(el.dataset.i); render(); },
  "subj-tab"(el){ E.s = Number(el.dataset.i); E.i=0; render(); },
  submit(){ const un = E.subjects.reduce((n,s,si)=>n+s.qs.filter((_,i)=>E.answers[`${si}_${i}`]===undefined).length,0);
    if(confirm(un?`You have ${un} unanswered question(s). Submit anyway?`:"Submit your test now?")) finishExam(); },
  async "pay-submit"(el){
    const name=$("#p-name").value.trim(), amount=Number($("#p-amt").value), reference=$("#p-ref").value.trim();
    if(!name||!reference||!amount) return toast("Fill in all the payment fields.");
    el.disabled=true;
    try{
      await addDoc(collection(db,"payments"),{ uid:S.user.uid, email:S.user.email.toLowerCase(), name, amount, reference, status:"pending", createdAt:serverTimestamp() });
      toast("Payment submitted. We will activate your account after confirming."); render();
    }catch(e){ toast(friendly(e)); el.disabled=false; }
  },
  /* admin */
  "admin-tab"(el){ S.adminTab=el.dataset.k; render(); },
  async "save-settings"(){
    const data = { price:Number($("#s-price").value), bankName:$("#s-bank").value.trim(), accountNumber:$("#s-no").value.trim(), accountName:$("#s-name").value.trim(), contact:$("#s-contact").value.trim() };
    if(!data.price||!data.accountNumber) return toast("Price and account number are required.");
    try{ await setDoc(doc(db,"settings","app"),data); S.settings={...DEFAULT_SETTINGS,...data}; toast("Saved."); }catch(e){ toast(friendly(e)); }
  },
  async "pay-approve"(el){
    try{ await updateDoc(doc(db,"payments",el.dataset.id),{status:"approved"}); await updateDoc(doc(db,"users",el.dataset.uid),{paid:true}); toast("Approved. User is now premium."); loadAdminTab(); }catch(e){ toast(friendly(e)); }
  },
  async "pay-reject"(el){ try{ await updateDoc(doc(db,"payments",el.dataset.id),{status:"rejected"}); loadAdminTab(); }catch(e){ toast(friendly(e)); } },
  "user-search"(el){ drawUsers(el.value); },
  async ban(el){
    if(el.dataset.v==="1" && !confirm("Ban this user? They will lose access immediately.")) return;
    try{ await updateDoc(doc(db,"users",el.dataset.id),{banned:el.dataset.v==="1"}); toast(el.dataset.v==="1"?"User banned.":"User unbanned."); loadAdminTab(); }catch(e){ toast(friendly(e)); }
  },
  async premium(el){ try{ await updateDoc(doc(db,"users",el.dataset.id),{paid:el.dataset.v==="1"}); loadAdminTab(); }catch(e){ toast(friendly(e)); } },
  async "add-q"(){
    const g = id=>$(id).value.trim();
    const options=[g("#q-a"),g("#q-b"),g("#q-c"),g("#q-d")];
    if(!g("#q-text")||options.some(o=>!o)) return toast("Fill in the question and all four options.");
    try{
      await addDoc(collection(db,"questions"),{ subject:g("#q-sub"), year:g("#q-year"), question:g("#q-text"), options, answer:Number($("#q-ans").value), explanation:g("#q-exp"), free:$("#q-free").value==="yes", createdAt:serverTimestamp() });
      toast("Question added."); ["#q-text","#q-a","#q-b","#q-c","#q-d","#q-exp"].forEach(i=>$(i).value=""); drawQuestions();
    }catch(e){ toast(friendly(e)); }
  },
  async bulk(el){
    let arr; try{ arr=JSON.parse($("#bulk").value); if(!Array.isArray(arr)) throw 0; }catch{ return toast("Invalid JSON. It must be an array."); }
    el.disabled=true; try{ const n = await importQuestions(arr); toast(`Imported ${n} question(s).`); $("#bulk").value=""; drawQuestions(); }catch(e){ toast(friendly(e)); } el.disabled=false;
  },
  async seed(el){
    if(!confirm("Add 30 sample questions (5 subjects)?")) return;
    el.disabled=true; try{ const n=await importQuestions(SAMPLE); toast(`Added ${n} sample questions.`); drawQuestions(); }catch(e){ toast(friendly(e)); } el.disabled=false;
  },
  "q-filter"(){ drawQuestions(); },
  async "q-free"(el){ try{ await updateDoc(doc(db,"questions",el.dataset.id),{free:el.dataset.v==="1"}); drawQuestions(); }catch(e){ toast(friendly(e)); } },
  async "q-del"(el){ if(!confirm("Delete this question?")) return; try{ await deleteDoc(doc(db,"questions",el.dataset.id)); drawQuestions(); }catch(e){ toast(friendly(e)); } }
};
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act;
  if(["year","user-search","q-filter"].includes(act)) return;      // handled by input/change
  if(el.tagName==="A") e.preventDefault();
  if(act==="pick" && el.tagName!=="INPUT") return;
  A[act]?.(el);
});
document.addEventListener("change", e=>{ const el=e.target.closest("[data-act]"); if(el && ["year","q-filter"].includes(el.dataset.act)) A[el.dataset.act](el); });
document.addEventListener("input", e=>{ const el=e.target.closest("[data-act]"); if(el && el.dataset.act==="user-search") A["user-search"](el); });
$("#yr").textContent = new Date().getFullYear();
</script>
